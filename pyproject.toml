[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas"
version = "0.1.0"
description = "Veritas fact verification project"
requires-python = ">=3.11"

[project.scripts]
veritas-verify = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = [
  "agent*",
  "core*",
  "data*",
  "evaluation*",
  "models*",
  "rag*",
  "ranking*",
  "retrieval*",
  "serving*",
  "training*",
  "ui*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
