model:
  base_model: distilroberta-base
data:
  gold_train_file: data/processed/verifier_train.jsonl
  gold_val_file: data/processed/verifier_val.jsonl
  gold_test_file: data/processed/verifier_test.jsonl
  topk_train_file: data/processed/verifier_train_topk_augmented.jsonl
  topk_val_file: data/processed/verifier_val_topk_augmented.jsonl
  topk_test_file: data/processed/verifier_test_topk_augmented.jsonl
training:
  epochs: 4
  batch_size: 16
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-05
  max_length: 256
  warmup_ratio: 0.06
  weight_decay: 0.01
  max_grad_norm: 1.0
  use_class_weights: true
  use_weighted_sampler: false
  early_stopping_patience: 2
  seed: 42
checkpoint:
  output_dir: checkpoints/retrieved_augmented_verifier
