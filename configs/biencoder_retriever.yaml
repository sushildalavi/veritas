model:
  base_model: sentence-transformers/all-MiniLM-L6-v2
training:
  train_file: data/processed/retriever_train_pairs.jsonl
  val_file: data/processed/retriever_val_pairs.jsonl
  num_epochs: 2
  batch_size: 16
  learning_rate: 2.0e-05
  warmup_ratio: 0.1
  max_hard_negatives: 1
  seed: 42
checkpoint:
  output_dir: checkpoints/biencoder_retriever
