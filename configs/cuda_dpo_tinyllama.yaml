# CUDA DPO alignment config for the citation-grounded verifier.
#
# Requires a CUDA GPU with bitsandbytes + trl installed (e.g. Colab/Kaggle T4
# or better). Not runnable on CPU/MPS-only machines. Starts from the CUDA
# QLoRA adapter (checkpoints/cuda_qlora_verifier/, see
# configs/cuda_qlora_tinyllama.yaml) and aligns it with TRL's DPOTrainer using
# data/processed/preference_pairs.jsonl (built by
# scripts/build_preference_pairs_real.py).
base_model: TinyLlama/TinyLlama-1.1B-Chat-v1.0
qlora_adapter_path: checkpoints/cuda_qlora_verifier
data:
  preference_pairs_file: data/processed/preference_pairs.jsonl
  eval_file: data/processed/mlx_lora/valid.jsonl
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: float16
dpo:
  beta: 0.1
  max_length: 512
  max_prompt_length: 384
training:
  output_dir: checkpoints/cuda_dpo_verifier
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-5
  seed: 42
eval:
  max_new_tokens: 160
report:
  json: reports/cuda_dpo_eval.json
  md: reports/cuda_dpo_eval.md
