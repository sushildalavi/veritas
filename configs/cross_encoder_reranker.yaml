model:
  base_model: cross-encoder/ms-marco-MiniLM-L-6-v2
training:
  train_file: data/processed/reranker_train_pairs.jsonl
  val_file: data/processed/reranker_val_pairs.jsonl
  num_epochs: 1
  batch_size: 16
  learning_rate: 2.0e-05
  warmup_ratio: 0.1
  max_length: 256
  seed: 42
checkpoint:
  output_dir: checkpoints/cross_encoder_reranker
