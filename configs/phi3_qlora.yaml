base_model: microsoft/Phi-3-mini-4k-instruct
train_file: data/processed/phi3_qlora/train.jsonl
eval_file: data/processed/phi3_qlora/valid.jsonl
output_dir: adapters/phi3_veritas_qlora
report_json: reports/qlora_training_metrics.json
before_after_md: reports/qlora_before_after_examples.md
max_seq_length: 2048
learning_rate: 2.0e-4
num_train_epochs: 2
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
