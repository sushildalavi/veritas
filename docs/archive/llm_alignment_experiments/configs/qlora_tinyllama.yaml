# QLoRA fine-tuning config for the faithfulness-explanation model.
#
# Requires a CUDA GPU with bitsandbytes installed (e.g. Colab/Kaggle T4 or
# better). Not runnable on CPU/MPS-only machines.
base_model: TinyLlama/TinyLlama-1.1B-Chat-v1.0
data:
  train_file: data/processed/verifier_train.jsonl
  val_file: data/processed/verifier_val.jsonl
  max_train_examples: 2000
  max_val_examples: 200
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: float16
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
training:
  output_dir: checkpoints/qlora_tinyllama
  num_train_epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  max_seq_length: 512
  seed: 42
report:
  json: reports/qlora_eval.json
  md: reports/qlora_eval.md
