# CUDA QLoRA fine-tuning config for the citation-grounded verifier.
#
# Requires a CUDA GPU with bitsandbytes installed (e.g. Colab/Kaggle T4 or
# better). Not runnable on CPU/MPS-only machines. Trains the same
# Verdict/Explanation/Citation task as the MLX LoRA adapter
# (checkpoints/mlx_lora_verifier/), on TinyLlama instead of Qwen2.5, so the
# resulting adapter can be used as the base for CUDA DPO (Phase 5).
base_model: TinyLlama/TinyLlama-1.1B-Chat-v1.0
data:
  train_file: data/processed/mlx_lora/train.jsonl
  val_file: data/processed/mlx_lora/valid.jsonl
  sft_train_file: data/processed/sft_train.jsonl
  sft_val_file: data/processed/sft_val.jsonl
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: float16
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
training:
  output_dir: checkpoints/cuda_qlora_verifier
  num_train_epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  max_seq_length: 512
  seed: 42
eval:
  max_new_tokens: 160
report:
  json: reports/cuda_qlora_eval.json
  md: reports/cuda_qlora_eval.md
